<!DOCTYPE html>
<html>
	<head>
		<title>{"Files"}</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	</head>
	<body data-ckeditor-func-num="{CKEDITOR_FUNC_NUM}">
		<!-- BEGIN IMAGE_BLOCK -->
		<div style="height: 100px; width: 100px; float: left; position: relative; margin: 5px;">
			<div title="{FILE_NAME}" data-bs-title="{FILE_NAME}" data-file-url="{FILE_SRC}" style="cursor: pointer; width: 100%; height: 100%; background-image:url('{FILE_SRC}'); background-size: cover; background-position: center center;"></div>
			<form action="{DELETE_URL}" method="post" data-confirm="{'Are you sure to delete?'}" style="position: absolute; right: -5px; top:-5px; display: inline;">
				<input type="hidden" name="delete-file" value="{FILE_NAME}" />
				<button title="{'Delete'}" data-bs-title="{'Delete'}" type="submit" style="border: 1px solid #FFF; background-color: #555; color: #FFF; padding: 1px 6px; text-decoration: none; font-family:sans-serif; font-size: 16px; font-weight: bolder; cursor: pointer;">&times;</button>
			</form>
		</div>
		<!-- END IMAGE_BLOCK -->
		<!-- BEGIN FILE_BLOCK -->
		<div style="position: relative; padding: 10px; border: 1px solid #ccc; margin: 5px;">
			<a data-file-url="{FILE_SRC}" href="#">{FILE_NAME}</a>
			<form action="{DELETE_URL}" method="post" data-confirm="{'Are you sure to delete?'}" style="position: absolute; right: 1px; top: 1px; display: inline;">
				<input type="hidden" name="delete-file" value="{FILE_NAME}" />
				<button title="{'Delete'}" data-bs-title="{'Delete'}" type="submit" style="border: 1px solid #FFF; background-color: #555; color: #FFF; padding: 1px 6px; text-decoration: none; font-family:sans-serif; font-size: 16px; font-weight: bolder; cursor: pointer;">&times;</button>
			</form>
		</div>
		<!-- END FILE_BLOCK -->
		<script type="text/javascript">
		(function () {
			'use strict';

			var funcNum = parseInt(document.body.getAttribute('data-ckeditor-func-num'), 10);
			if (isNaN(funcNum)) funcNum = 0;

			function selectFile(url) {
				if (window.opener && window.opener.CKEDITOR && window.opener.CKEDITOR.tools) {
					window.opener.CKEDITOR.tools.callFunction(funcNum, url);
					window.close();
				}
			}

			document.addEventListener('click', function (event) {
				var element = event.target;
				while (element && element !== document) {
					if (element.hasAttribute && element.hasAttribute('data-file-url')) {
						event.preventDefault();
						selectFile(element.getAttribute('data-file-url'));
						return;
					}
					element = element.parentNode;
				}
			});

			document.addEventListener('submit', function (event) {
				var message = event.target.getAttribute('data-confirm');
				if (message && !window.confirm(message)) {
					event.preventDefault();
				}
			});
		})();
		</script>
	</body>
</html>
